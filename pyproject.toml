[project]
name = "lazurich"
version = "0.1.0"
description = "Feature rich Minecraft launcher"
readme = "README.md"
authors = [
    { name = "wojtmic", email = "mail@wojtmic.dev" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx[http2]>=0.28.1",
    "keyring>=25.7.0",
    "loguru>=0.7.3",
    "msal>=1.39.0",
    "peewee>=4.5.3",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
lazurich = "lazurich:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", 'B', 'SIM', 'E4', 'E9', 'UP', 'ASYNC', 'F']

# Note: do not use ruff format, ever
